<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="google-site-verification"
      content="0kJ0sj-nmGOc9o6aT0Sv23CrsC-V5TBXqTxDRun-xP8"
    />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Madhav's DSA Sheet</title>

    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var s = JSON.parse(localStorage.getItem('madhav-dsa:settings') || '{}');
        if (s && s.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
